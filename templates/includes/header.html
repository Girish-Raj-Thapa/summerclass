<header class="section-header">
  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg header-top">
    <div class="container">
      <button
        class="navbar-toggler border-0"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#topNavbar"
      >
        <i class="fas fa-bars text-dark"></i>
      </button>
      <div class="collapse navbar-collapse" id="topNavbar">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="fas fa-globe"></i> English
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="fas fa-dollar-sign"></i> USD
            </a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="fas fa-envelope"></i> Email
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <i class="fas fa-phone"></i> Call us
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <!-- Main Header -->
  <section class="header-main">
    <div class="container">
      <div class="row align-items-center g-3">
        <!-- Logo -->
        <div class="col-lg-2 col-md-3 col-6">
          <a href="{% url 'home' %}" class="brand-wrap">
            <!-- Replace with your actual logo -->
            <div class="d-flex align-items-center">
              <!-- Logo image -->
              <img
                src="{{ site_setting.logo.url }}"
                alt="Logo"
                style="height: 40px; width: auto; margin-right: 10px"
              />
            </div>
          </a>
        </div>
        <!-- Category Dropdown -->
        <div class="col-lg-auto col-md-auto col-6">
          <div class="category-wrap dropdown">
            <button
              class="btn btn-category dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
            >
              <i class="fas fa-bars me-2"></i> All Categories
            </button>
            <ul class="dropdown-menu">
              <li>
                <a class="dropdown-item" href="{% url 'store' %}"
                  >All Products</a
                >
              </li>
              {% for category in categories %}
              <li>
                <a
                  class="dropdown-item"
                  href="{% url 'products_by_category' category.slug %}"
                >
                  {{ category.name }}
                </a>
              </li>
              {% endfor %}
            </ul>
          </div>
        </div>
        <!-- Store Button -->
        <div class="col-lg-auto col-md-auto">
          <a href="{% url 'store' %}" class="btn btn-store">
            <i class="fas fa-store me-2" style="color: inherit"></i> Store
          </a>
        </div>
        <!-- Search Bar -->
        <div class="col-lg col-md-6 col-12">
          <div class="search-container">
            <form class="search-form" action="{% url 'search' %}" action="GET">
              <input
                type="text"
                name="keyword"
                class="form-control search-input"
                placeholder="Search for products, brands and more..."
                value="{{ request.GET.keyword|default:'' }}"
              />
              <button type="submit" class="search-btn">
                <i class="fas fa-search"></i>
              </button>
            </form>
          </div>
        </div>
        <!-- User Actions -->
        <div class="col-lg-auto col-md-3 col-12">
          <div class="user-widget">
            <div class="user-info">
              <div class="user-welcome">Welcome guest!</div>
              <div class="user-links">
                {% if user.is_authenticated %}
                <a href="{% url 'user_dashboard' %}">Dashboard</a>
                <span class="separator">|</span>
                <a href="{% url 'user_logout' %}">Logout</a>
                {% else %}
                <a href="{% url 'user_login' %}">Login</a>
                <span class="separator">|</span>
                <a href="{% url 'user_register' %}">Register</a>
                {% endif %}
              </div>
            </div>
            <a href="{% url 'cart' %}" class="cart-widget">
              <i class="fas fa-shopping-cart cart-icon"></i>
              <span class="cart-badge">{{ cart_count }}</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>
</header>
